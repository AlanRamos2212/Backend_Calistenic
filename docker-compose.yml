services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: calistenic-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    container_name: calistenic-postgres
    environment:
      - POSTGRES_DB=calistenicdb
      - POSTGRES_USER=calistenic
      - POSTGRES_PASSWORD=calistenic_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calistenic -d calistenicdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calistenic-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/calistenicdb
      - SPRING_DATASOURCE_USERNAME=calistenic
      - SPRING_DATASOURCE_PASSWORD=calistenic_pass
      # Obligatorio con el perfil docker (fail-fast si falta)
      - APP_JWT_SECRET=${APP_JWT_SECRET:?Defina APP_JWT_SECRET para JWT}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      # Media: local by default; use cloudinary only when both variables exist in .env.
      - APP_MEDIA_STRATEGY=${APP_MEDIA_STRATEGY:-local}
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
    ports:
      - "8083:8082"
    volumes:
      # Persist uploaded media (avatars, post images) across container restarts
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  esdata:
    driver: local
  pgdata:
    driver: local
