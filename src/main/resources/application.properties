server.port=${PORT:8082}
server.address=0.0.0.0

spring.application.name=backend-calistenic

spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/calistenicdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:calistenic}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:calistenic_pass}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — evita "connection has been closed" en Hibernate schema validation
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# NONE: Flyway es el único responsable del schema. Hibernate solo mapea, no altera.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Elasticsearch local: requiere que el contenedor esté disponible en localhost:9200.
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:${ELASTICSEARCH_URL:http://localhost:9200}}

app.media.storage-dir=${APP_MEDIA_STORAGE_DIR:uploads/media}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS for Angular dev server
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# JWT
app.jwt.secret=${APP_JWT_SECRET:CalistenicTrackSuperSecretKeyJWTTokenForSecurityMustBeLongEnough}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.device-jwt.expiration-ms=${APP_DEVICE_JWT_EXPIRATION_MS:900000}

# Flyway local compatibility
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.backend.modulo.security=INFO
# Never enable DEBUG for request body processing in environments with credentials.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
