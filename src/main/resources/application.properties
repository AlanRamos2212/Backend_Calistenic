server.port=${PORT:8082}

spring.application.name=backend-calistenic

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/calistenicdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:calistenic}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:calistenic_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

# CORS for Angular dev server
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# JWT
app.jwt.secret=${APP_JWT_SECRET:CalistenicTrackSuperSecretKeyJWTTokenForSecurityMustBeLongEnough}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.device-jwt.expiration-ms=${APP_DEVICE_JWT_EXPIRATION_MS:900000}

# Flyway local compatibility
# Some local environments keep stale schema history from earlier failed migrations.
# Skip strict validation during local startup so the app boots while the metadata is repaired.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.backend.modulo.security=DEBUG
