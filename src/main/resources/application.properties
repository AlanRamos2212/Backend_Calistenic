# ── Perfil por defecto: desarrollo local (sin Docker) ──────────────────────
server.port=8080

# Elasticsearch (requiere `docker-compose up elasticsearch` o instalación local)
spring.elasticsearch.uris=http://localhost:9200

# CORS Global (Angular en localhost:4200)
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# H2 en memoria para desarrollo rápido sin levantar Postgres
spring.datasource.url=jdbc:h2:mem:calistenicdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Actuator: usado por el healthcheck de Docker en el perfil "docker"
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
