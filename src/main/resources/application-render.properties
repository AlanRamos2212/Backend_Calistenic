server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Seguridad: el JWT secret es OBLIGATORIO vía variable de entorno (sin fallback).
app.jwt.secret=${APP_JWT_SECRET}

spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS}
spring.elasticsearch.username=${SPRING_ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${SPRING_ELASTICSEARCH_PASSWORD:}

app.media.strategy=${APP_MEDIA_STRATEGY:local}
app.media.storage-dir=${APP_MEDIA_STORAGE_DIR:uploads/media}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
