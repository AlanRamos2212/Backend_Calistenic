# ── Perfil "docker": activado dentro del contenedor del backend ────────────
# Se activa con SPRING_PROFILES_ACTIVE=docker en docker-compose.yml.
# La diferencia clave: usa los nombres de servicio de Docker Compose
# ("elasticsearch", "postgres") en lugar de "localhost", porque dentro
# de la red interna de Docker cada contenedor se resuelve por su nombre
# de servicio, no por localhost.

server.port=8082

spring.elasticsearch.uris=http://elasticsearch:9200

spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# PostgreSQL persistente dentro de Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/calistenicdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=calistenic
spring.datasource.password=calistenic_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No fallar rápido si la base de datos aún no responde (evita que el contenedor termine)
# Valor en milisegundos; -1 desactiva el fail-fast y deja que Hikari reintente.
spring.datasource.hikari.initialization-fail-timeout=-1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
